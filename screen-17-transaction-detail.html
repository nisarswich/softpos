<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#070707"/>
<title>Screen 17 — Transaction — Swich SoftPOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>
<div class="frame-stage">
<div>
  <div class="phone">
    <div data-notch></div>
    <div class="statusbar" data-statusbar></div>

    <div class="screen">
      <div class="topbar" id="tb">
        <a href="screen-16-transaction-list.html" class="icon-btn" title="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
        <div class="topbar-title">Transaction</div>
        
      </div>

      <div class="fin-body">
<div class="fin-scroll">

<div style="text-align:center;padding:6px 0 0;">
  <div class="avatar" id="d-ico" style="margin:0 auto 10px;width:52px;height:52px;"></div>
  <div class="micro-label" id="d-title">Card sale</div>
  <div class="amount-display" id="d-amt" style="margin:4px 0 6px;">Rs 2,450</div>
  <div id="d-badge"></div>
</div>
<div id="d-banner"></div>
<div class="card card-pad" style="padding-top:6px;padding-bottom:6px;" id="d-kv"></div>

</div><div class="fin-footer" id="d-foot"></div>
      </div>

    </div>

    <div class="home-indicator"></div>
  </div>
  <div class="frame-caption"><b>Screen 17</b> — Transaction Detail — any type</div>
</div>
</div>

<div class="mockup-controls">
  <div class="tag">Appearance</div>
  <div class="theme-switcher">
    <button data-theme-btn="dark" class="active" onclick="setTheme('dark')">Dark</button>
    <button data-theme-btn="light" onclick="setTheme('light')">Light</button>
  </div>
  <div class="tag">Demo role (Cashier sees Collect + own Activity only)</div>
  <div class="role-switcher">
    <button data-role-btn="owner" onclick="setRole('owner')">Owner</button>
    <button data-role-btn="branch_manager" onclick="setRole('branch_manager')">Branch Manager</button>
    <button data-role-btn="solo" onclick="setRole('solo')">Solo owner</button>
    <button data-role-btn="cashier" onclick="setRole('cashier')">Cashier only</button>
  </div>
  <div class="tag" style="margin-top:6px;">Jump to a sample</div>
  <button onclick="location.search='?id=TXN-88231'">Card sale</button><button onclick="location.search='?id=LNK-4521'">Link pending</button><button onclick="location.search='?id=LNK-219'">Link expired</button><button onclick="location.search='?id=TXN-88074'">Declined</button>
  <button onclick="location.search='?id=TX-0901'">Transfer</button><button onclick="location.search='?id=TX-0904'">Bill</button><button onclick="location.search='?id=TX-0902'">Airtime</button><button onclick="location.search='?id=TX-0903'">Financing</button><button onclick="location.search='?id=TU-0801'">Top-up</button><button onclick="location.search='?id=STL-1103'">Settlement</button>
  <div class="tag" style="margin-top:6px;">Demo</div><button id="paybtn" style="display:none" onclick="markLinkPaid(T.id);render()">Customer pays the link</button>
  <span id="tu-demo" style="display:none;"><button onclick="decideTopup(T.id,true);render()">Approve request</button> <button onclick="decideTopup(T.id,false);render()">Decline request</button></span>
  <div class="tag" style="margin-top:6px;">Demo data</div>
  <button onclick="finReset()">↺ Reset finance demo data</button>
  <a href="index.html" class="back" style="width:100%;text-align:center;margin-top:6px;">← All screens</a>
</div>

<script src="assets/app.js"></script>
<script src="assets/finance.js"></script>
<script>

const Q = new URLSearchParams(location.search);
let T = txById(Q.get('id')) || FS.acts[0];
const STN = { success: 'Completed', pending: 'Pending', expired: 'Expired', declined: 'Declined', failed: 'Not completed' };
const STC = { success: 'green', pending: 'blue', expired: 'neutral', declined: 'red', failed: 'amber' };
const kv = (k, v) => '<div class="kv"><span>' + k + '</span><b>' + v + '</b></div>';
const btn = (cls, label, href, onclick) => href ? '<a class="btn ' + cls + ' block" href="' + href + '">' + label + '</a>' : '<button class="btn ' + cls + ' block" onclick="' + onclick + '">' + label + '</button>';
const LABEL = { sale: 'Sale', link: 'Payment link', settlement: 'Settlement', transfer: 'Money sent', bill: 'Bill payment', airtime: 'Airtime', credit: 'Financing', topup: 'Deposit request' };
function render(){
  T = txById(T.id); byId('tu-demo').style.display = 'none'; const x = T.x || {}, pos = T.a > 0, ok = T.st === 'success';
  byId('d-ico').innerHTML = icn(T.i, 22); byId('d-ico').style.color = 'var(--brand-teal)';
  byId('d-title').textContent = T.t;
  const a = byId('d-amt'); a.textContent = (pos ? '+ ' : '− ') + rs(Math.abs(T.a)); a.style.color = (['declined','failed','expired'].includes(T.st) ? 'var(--text-faint)' : (pos && ok ? 'var(--green)' : 'var(--heading)'));
  byId('d-badge').innerHTML = '<span class="badge ' + STC[T.st] + '">' + STN[T.st] + '</span>';
  let rows = kv('Type', LABEL[T.type] + (T.ch ? ' · ' + ({retail:'In-store',online:'Online',link:'Link'}[T.ch]) : '')) + kv('When', T.time) + kv('Reference', '<span class="mono" style="font-size:12px">' + (x.ref || T.id) + '</span>');
  let banner = '', foot = '';
  if (T.type === 'sale') {
    rows += kv('Method', T.s.replace('Retail · ', '').replace('Online · ', ''));
    if (T.ch === 'retail') rows += kv('Taken by', (T.by || '—') + ' · ' + (x.device || 'Front Counter'));
    rows += kv('Branch', 'Riverside Outlet');
    if (T.st === 'declined' || T.st === 'failed') banner = '<div class="banner ' + (T.st==='declined' ? 'red' : 'amber') + '"><div>' + (x.reason || 'Payment not completed') + '. No money was collected.</div></div>';
    if (ok) foot = btn('danger-ghost', 'Refund this payment', 'screen-12-refund-void.html') + btn('ghost', 'Share receipt', '', '');
    else foot = btn('primary', 'Try again', 'screen-06-manual-amount.html');
  }
  if (T.type === 'link') {
    rows += kv('Created by', (T.by || '—')) + kv('Link expiry', x.expiry || '24 hours') + kv('Note', T.s);
    if (T.st === 'pending') { foot = btn('ghost', 'Resend link', 'screen-22-payment-link-share.html') + btn('danger-ghost', 'Cancel this link', '', 'cancelLink()'); byId('paybtn').style.display = 'inline-block'; }
    if (T.st === 'expired') { banner = '<div class="banner"><div style="color:var(--text-dim)">' + (x.cancelled ? 'Cancelled by ' + x.cancelled + ' — this link can no longer be paid.' : 'This link expired without payment and can no longer be paid.') + '</div></div>'; foot = btn('ghost', 'Create a new link', 'screen-21-create-payment-link.html'); }
    if (ok) foot = btn('danger-ghost', 'Refund this payment', 'screen-12-refund-void.html') + btn('ghost', 'Share receipt', '', '');
  }
  if (T.type === 'transfer') {
    rows = kv('To', x.to) + kv('Account', x.acct) + kv('Method', (x.rail || 'Raast') + ' · Instant') + kv('Purpose', x.purpose || '—') + (x.note ? kv('Note', x.note) : '') + kv('Fee', rs(x.fee || 0)) + kv('When', T.time) + kv('Reference', '<span class="mono" style="font-size:12px">' + (x.ref || T.id) + '</span>');
    if (T.st === 'pending') banner = '<div class="banner amber">' + '<div>The receiving bank is still confirming. This amount is on hold and returns to your balance if it fails.</div></div>';
    const ot = x.onetime; foot = btn('primary', 'Pay again', 'screen-24-send-money.html?' + (ot ? 'to=ONE&name=' + encodeURIComponent(ot.n) + '&s=' + encodeURIComponent(ot.s) + '&type=' + ot.t : 'to=' + (x.payee || 'AT')) + '&amt=' + (Math.abs(T.a) - (x.fee || 0)) + '&rail=' + (x.railKey || 'raast')) + btn('ghost', 'Share receipt', '', '');
  }
  if (T.type === 'bill') { rows = kv('Biller', x.biller) + kv('Consumer no.', x.refno) + kv('When', T.time) + kv('Reference', '<span class="mono" style="font-size:12px">' + (x.ref || T.id) + '</span>'); foot = btn('primary', 'Pay a bill again', 'screen-27-pay-bills.html') + btn('ghost', 'Share receipt', '', ''); }
  if (T.type === 'airtime') { rows = kv('Operator', x.op + ' · ' + (x.kind || 'Prepaid')) + kv('Number', x.num) + kv('When', T.time) + kv('Reference', '<span class="mono" style="font-size:12px">' + (x.ref || T.id) + '</span>'); foot = btn('primary', 'Send airtime again', 'screen-28-airtime.html') + btn('ghost', 'Share receipt', '', ''); }
  if (T.type === 'settlement') { rows = kv('Payments settled', (x.count || 12) + ' sales') + kv('Credited to', 'Wallet balance') + kv('When', T.time) + kv('Reference', '<span class="mono" style="font-size:12px">' + T.id + '</span>'); foot = btn('primary', 'View day-end report', 'screen-18-day-end-report.html'); }
  if (T.type === 'credit') {
    const loan = x.kind === 'loan';
    rows = kv('Product', loan ? 'Loan ' + x.loan : 'Running finance') + kv('Direction', pos ? 'Added to your balance' : 'Paid from your balance') + kv('When', T.time) + kv('Reference', '<span class="mono" style="font-size:12px">' + T.id + '</span>');
    foot = btn('primary', loan ? 'View loan' : 'Open running finance', loan ? 'screen-32-loan-detail.html?loan=' + x.loan : 'screen-29-running-finance.html');
  }

  if (T.type === 'topup') {
    const forL = x.kind === 'balance' ? 'Add to balance' : (x.kind === 'rf' ? 'Repay running finance' : 'Repay loan ' + x.loan);
    rows = kv('Request', '<span class="mono" style="font-size:12px">' + T.id + '</span>') + kv('For', forL) + kv('Amount', rs(x.amt)) + kv('Slip', x.slip || 'deposit-slip.jpg') + kv('Submitted', T.time);
    if (T.st === 'pending') { banner = '<div class="banner blue"><div>Under review — usually within 30 minutes. ' + (x.kind === 'balance' ? 'Your balance is credited as soon as the deposit is confirmed.' : 'The repayment is applied as soon as the deposit is confirmed.') + '</div></div>'; foot = btn('danger-ghost', 'Cancel request', '', 'cancelTopup()'); byId('tu-demo').style.display = 'block'; }
    if (T.st === 'declined') { banner = '<div class="banner red"><div>' + (x.reason || 'Request declined') + '. Upload a clearer slip and try again.</div></div>'; foot = btn('primary', 'Submit again', 'screen-34-topup.html?for=' + (x.kind === 'balance' ? 'balance' : 'repay')); }
    if (T.st === 'expired') { banner = '<div class="banner"><div style="color:var(--text-dim)">Cancelled by you.</div></div>'; foot = btn('primary', 'Start a new request', 'screen-34-topup.html?for=balance'); }
    if (ok) foot = btn('ghost', 'Share receipt', '', '');
  }
  byId('d-kv').innerHTML = rows; byId('d-banner').innerHTML = banner; byId('d-foot').innerHTML = foot;
  if (T.type === 'link' && T.st !== 'pending') byId('paybtn').style.display = 'none';
}
function cancelTopup(){ T.st = 'expired'; finSave(); render(); }
function cancelLink(){ T.st = 'expired'; T.x.cancelled = 'cashier-nisar'; finSave(); render(); }
render();

</script>
</body>
</html>
