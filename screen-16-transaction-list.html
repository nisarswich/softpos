<div id="dir-wrap" class="segmented"><button data-d="all" class="active" onclick="setDir('all')">All</button><button data-d="in" onclick="setDir('in')">Money in</button><button data-d="out" onclick="setDir('out')">Money out</button></div>

<script src="assets/app.js"></script>
<script src="assets/finance.js"></script>
<script>

const Q = new URLSearchParams(location.search);
let dir = ['in','out'].includes(Q.get('dir')) ? Q.get('dir') : 'all', typ = 'all', when = Q.get('when') === 'today' ? 1 : 0;
const WHEN = ['Any time', 'Today', 'Last 7 days'];
const GROUPS = {
  all: [['all','All'],['attn','Needs attention'],['sale','Sales'],['transfer','Transfers'],['bill','Bills & airtime'],['credit','Credit']],
  in:  [['all','All'],['sale','Sales'],['link','Links'],['settlement','Settlements'],['credit','Credit']],
  out: [['all','All'],['transfer','Transfers'],['bill','Bills & airtime'],['credit','Loans & credit']],
};
const matchType = (t, k) => k==='all' || (k==='attn' ? t.st!=='success' : (k==='bill' ? (t.type==='bill' || t.type==='airtime') : (k==='sale' ? (t.type==='sale' || t.type==='link') : t.type===k)));
function cashier(){ return getRole() === 'cashier'; }
function setDir(d){ dir = d; typ = 'all'; render(); }
function setTyp(k){ typ = k; render(); }
function cycleWhen(){ when = (when + 1) % 3; render(); }
function render(){
  const c = cashier();
  byId('dir-wrap').style.display = c ? 'none' : 'flex'; byId('mine').style.display = c ? 'flex' : 'none';
  byId('chips').style.display = c ? 'none' : 'flex';
  byId('tb').querySelector('.topbar-title').textContent = c ? 'My Sales' : 'Activity';
  document.querySelectorAll('#dir-wrap button').forEach(b => b.classList.toggle('active', b.dataset.d === dir));
  byId('chips').innerHTML = GROUPS[dir].map(g => '<span class="filter-chip' + (g[0]===typ ? ' set' : '') + '" style="cursor:pointer" onclick="setTyp(\'' + g[0] + '\')">' + g[1] + '</span>').join('');
  byId('when-t').textContent = WHEN[when];
  const q = (byId('q').value || '').toLowerCase();
  let rows = FS.acts.filter(t => {
    if (c) return (t.type==='sale' || t.type==='link') && t.by === 'cashier-nisar';
    if (dir==='in' && t.a < 0) return false; if (dir==='out' && t.a > 0) return false;
    return matchType(t, typ);
  }).filter(t => when===0 || (when===1 ? t.d===0 : t.d<=7)).filter(t => !q || (t.t + ' ' + t.s).toLowerCase().includes(q));
  const ok = t => t.st === 'success', inn = rows.filter(t => t.a>0 && ok(t)).reduce((s,t) => s + t.a, 0), out = rows.filter(t => t.a<0 && (ok(t) || t.st==='pending')).reduce((s,t) => s - t.a, 0);
  byId('sum-l').innerHTML = (c ? 'Collected ' : 'In ') + '<b style="color:var(--green)">' + rs(inn) + '</b>';
  byId('sum-r').innerHTML = c ? rows.length + ' sales' : 'Out <b style="color:var(--heading)">' + rs(out) + '</b>';
  let html = '', last = null;
  rows.forEach(t => {
    const g = t.d===0 ? 'Today' : (t.d===1 ? 'Yesterday' : 'Earlier');
    if (g !== last) { if (last) html += '</div>'; html += '<div class="day-head">' + g + '</div><div class="card">'; last = g; }
    html += actRow(t);
  });
  if (last) html += '</div>';
  byId('list').innerHTML = html || '<div class="access-restricted" style="padding:40px 20px;"><div class="h2" style="font-size:15px;">Nothing here</div><p class="body-text" style="margin-top:6px;">No activity matches these filters.</p></div>';
}
const _sr = setRole; setRole = function(r){ _sr(r); render(); };
render();

</script>
</body>
